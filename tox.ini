[tox]
envlist = py,flake8
isolated_build = false
#true

[testenv]
deps =
    pytest
    numpy
    pandas
    /local/data/druee/software/python-readmet/dist/readmet-0.6.3-py3-none-any.whl
commands = pytest {posargs}

[testenv:flake8]
setenv =
    PYFLAKES_NODOCTEST=1
deps =
    flake8
commands = flake8 {posargs}

[flake8]
extend-exclude = pub,docs,build