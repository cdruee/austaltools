[build-system]
requires = [
    "setuptools>=45.0",
    "wheel",
    "sphinx",
    "sphinx-argparse",
]
build-backend = "setuptools.build_meta"

[project]
name = "austaltools"
dynamic = ["version"]
description = "Tools for use with the Lagrangian atmospheric pollutant dispersion model AUSTAL (AUSbreitungsmodell nach TA-Luft)."
authors = [
    {name = "Clemens Drüe", email = "druee@uni-trier.de"},
]
license = {file = "LICENSE.txt"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["meteorology", "air quality", "modeling"]
dependencies = [
    "cdsapi",
    "gdal",
    "matplotlib", 
    "meteolib",
    "netcdf4",
    "numpy",
    "pandas",
    "pyyaml",
    "readmet", 
    "requests",
    "setuptools",
    "tqdm",
    "urllib3",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-argparse",
]
test = [
    "pytest",
    "scipy",
]
dev = [
    "flake8",
    "pytest",
    "scipy",
    "tox",
]

[project.urls]
Homepage = "https://github.com/username/austaltools"  # Replace with actual URL from _version.py
Repository = "https://github.com/username/austaltools"  # Replace with actual URL
Issues = "https://github.com/username/austaltools/issues"
Documentation = "https://austaltools.readthedocs.io"

[project.scripts]
austaltools = "austaltools.command_line:main"
austal-input = "austaltools.austal_input:main"
configure-austaltools = "austaltools.configure_austaltools:main"

# Setuptools configuration for backward compatibility with CI
[tool.setuptools]
packages = ["austaltools", "austaltools.data"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
"austaltools.data" = ["*.txt", "*.json"]

[tool.setuptools_scm]
version_file = "austaltools/_version.py"

# Keep setup.py compatibility for Debian packaging
[tool.setuptools.dynamic]
version = {attr = "austaltools._version.__version__"}

# Legacy setup.py compatibility layer
# This section ensures compatibility with CI systems that expect setup.py
[tool.setuptools.cmdclass]

# Additional metadata for Debian packaging compatibility
[tool.distutils.bdist_deb]
maintainer = "Author Name"  # Replace with actual maintainer
maintainer-email = "author@email.com"  # Replace with actual email
[tool.flake8]
extend-exclude = ["pub", "docs", "build", "deb_dist", "venv"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

